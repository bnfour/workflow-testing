# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
# Also obligatory: https://noyaml.com/

name: ".NET xdd"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_pack_draft_all_in_one:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Fetch tags without full history
      run: git fetch --tags
    - name: Did I forget to sign the commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash commit-sign-check.sh
    - name: Download external dependencies
      shell: bash
      env:
        PASS: ${{ secrets.DOWNLOAD_PASSWORD }}
        URL: ${{ secrets.DOWNLOAD_URL }}
      run: curl -u "runner:$PASS" "$URL" --output references.zip
    - name: Unpack external dependencies
      run: unzip references.zip -d references/
    - name: Restore NuGet dependencies
      run: dotnet restore
    - name: Debug build for testing
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    # note that Release build uses solution filter to not include tests in release mode
    - name: Release build for packing
      run: dotnet build --configuration Release --no-restore Bnfour.WorkflowTesting.Proper.Release.slnf
    - name: Run the release packer script
      shell: bash
      run: bash helper_script.sh
    - name: Draft the release in repo
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --fail-on-no-commits seems like a good idea in actual repos
      run: gh release create "v$new_version" "$filename" --draft --title "v$new_version — tl;dr" --notes-file notes
